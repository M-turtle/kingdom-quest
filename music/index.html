<title>Music Hall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;800&family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&family=Rubik:wght@500;700;900&family=Frank+Ruhl+Libre:wght@700;900&family=Assistant:wght@600;700;800&display=swap">

<style>
:root{ --accent:#c0396b; --accent-2:#6a1438; }
.bands{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
@media (max-width:600px){ .bands{grid-template-columns:1fr} }
.mq{display:grid; gap:14px; justify-items:center; width:100%}
.mq .listen{display:inline-flex; align-items:center; gap:10px; padding:12px 26px; border-radius:999px; border:0; cursor:pointer; font:800 18px/1 var(--font-body); color:#3a1020; background:linear-gradient(180deg,#ffe08a,#f2b84a); box-shadow:0 6px 18px rgba(0,0,0,.25)}
.mq .listen svg{width:22px; height:22px}
.mq .listen.playing{animation:mqPulse .9s ease-in-out infinite}
@keyframes mqPulse{50%{transform:scale(1.06); box-shadow:0 0 0 8px rgba(255,224,138,.25)}}
.mq .hero{width:min(46vw,180px); height:auto}
.mq .staffbox{width:min(92vw,420px)} .mq .staffbox svg{width:100%; height:auto; display:block}
.mq .choices{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; width:100%}
.mq .choice{display:flex; flex-direction:column; align-items:center; gap:6px; min-height:58px; justify-content:center; font-weight:800}
.mq .choice .kqm-art{width:84px; height:84px}
.mq .choice .kq-i{width:56px; height:56px}
.mq .choice.ok{outline:4px solid #3ecf7a} .mq .choice.bad{outline:4px solid #ff5a6a; opacity:.8}
.mq .bars{display:flex; gap:5px; justify-content:center} .mq .bars i{display:block; width:22px; border-radius:6px; box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.mq .piece{display:grid; gap:2px; text-align:center; padding:10px 16px; border-radius:14px; background:rgba(255,224,138,.14); border:1px solid rgba(255,224,138,.6)}
.mq .piece b{font-size:18px} .mq .piece span{font-size:14px; opacity:.85}
.kqm-art{display:block}
/* the Music Creator card on the pick screen */
.mc-card{display:flex; align-items:center; gap:14px; width:100%; margin:0 0 14px; padding:14px 16px; border-radius:18px; cursor:pointer; text-align:start; border:1px solid rgba(255,224,138,.55); background:linear-gradient(135deg,rgba(192,57,107,.35),rgba(90,40,140,.35)); color:inherit; font:inherit}
.mc-card .row{display:flex; gap:2px} .mc-card .row svg{width:44px; height:44px}
.mc-card b{display:block; font:800 20px/1.1 var(--font-title, Cinzel), serif} .mc-card span{font-size:14px; opacity:.85}
/* the Instrument Hall card (Yoni 2026-10-10): four of the paintings */
.mc-card.ih-entry{background:linear-gradient(135deg,rgba(226,191,104,.28),rgba(120,30,60,.4))} .mc-card.ih-entry .row svg{width:48px; height:48px}
</style>

    },
    highlow(tier, band) {
      const same = band >= 2 && Math.random() < 0.2, gap = same ? 0 : (band === 1 ? ri(7, 12) : ri(tier ? 2 : 3, 9)) * (Math.random() < 0.5 ? 1 : -1);
      const a = ri(57, 72), b = a + gap, ans = gap > 0 ? 'higher' : gap < 0 ? 'lower' : 'same', inst = pick(['piano', 'xylophone', 'flute']);
      const opts = [{ value: 'higher', label: t('a_higher'), pic: () => KQ.icon('🐦') }, { value: 'lower', label: t('a_lower'), pic: () => KQ.icon('🐘') }]; if (band >= 2) opts.push({ value: 'same', label: t('a_same'), pic: () => KQ.icon('🟰') });
      return Q({ skill: 'highlow', key: 'hl' + a + '_' + b, prompt: t('q_high'), speak: speak4(band, t('q_high')), answer: ans, opts, sound: () => M.seq([{ m: a, b: 0, d: 1, inst }, { m: b, b: 1.4, d: 1.2, inst }], { bpm: 80 }).ms, x: { ans } });
    },
    count(tier, band) {
      const n = ri(1, band === 1 ? (tier ? 5 : 4) : 6), lo = Math.max(1, n - ri(0, 2));
      const vals = [lo, lo + 1, lo + 2];   /* three neighbours, the answer anywhere among them */
      return Q({ skill: 'count', key: 'c' + n, prompt: t('q_count'), speak: speak4(band, t('q_count')), answer: String(n), opts: vals.map(v => ({ value: String(v), label: String(v) })), pic: hero('drums'), sound: () => M.seq(Array.from({ length: n }, (_, k) => ({ kind: k % 2 ? 'tom' : 'kick', b: k * 0.75, d: 0.75 })), { bpm: 90 }).ms, x: { n } });
    },
    loudfast(tier, band) {
      if (Math.random() < 0.5) { const loud = Math.random() < 0.5; return Q({ skill: 'loudfast', tags: ['loud'], key: 'ld' + loud, prompt: t('q_loud'), speak: speak4(band, t('q_loud')), answer: loud ? 'loud' : 'quiet', opts: [{ value: 'loud', label: t('a_loud'), pic: () => KQ.icon('🦁') }, { value: 'quiet', label: t('a_quiet'), pic: () => KQ.icon('🐭') }], pic: hero('drums'), sound: () => M.seq([0, 1, 2, 3].map(k => ({ kind: k % 2 ? 'snare' : 'kick', b: k * 0.6, d: 0.6, vel: loud ? 1 : 0.12 })), { bpm: 90 }).ms, x: { kind: 'loud' } }); }
      const fast = Math.random() < 0.5, bpm = fast ? 190 : 62; return Q({ skill: 'loudfast', tags: ['fast'], key: 'fs' + fast + ri(0, 3), prompt: t('q_fast'), speak: speak4(band, t('q_fast')), answer: fast ? 'fast' : 'slow', opts: [{ value: 'fast', label: t('a_fast'), pic: () => KQ.icon('🐰') }, { value: 'slow', label: t('a_slow'), pic: () => KQ.icon('🐢') }], sound: () => M.seq(M.parse('C5 D5 E5 C5 E5 D5 C5:2', 'xylophone'), { bpm }).ms, x: { kind: 'fast' } });
    },
    echo(tier, band) {
      const len = band <= 2 ? 3 : 4, span = band <= 2 ? 5 : 8, seq = Array.from({ length: len }, () => ri(0, span - 1));
      const variants = new Set([seq.join()]); const opts = [seq];
      while (opts.length < 3) { const v = seq.slice(); const k = ri(0, len - 1); v[k] = (v[k] + ri(1, span - 1)) % span; if (Math.random() < 0.4 && len > 2) { const j = (k + 1) % len; [v[k], v[j]] = [v[j], v[k]]; } if (!variants.has(v.join())) { variants.add(v.join()); opts.push(v); } }
      return Q({ skill: 'echo', key: 'e' + seq.join(''), prompt: t('q_echo'), speak: speak4(band, t('q_echo')), answer: seq.join(), opts: shuffle(opts).map(v => ({ value: v.join(), label: '', pic: barsPic(v) })), sound: () => M.seq(seq.map((k, n) => ({ m: NOTE5[k], b: n * 0.8, d: 0.8, inst: 'xylophone' })), { bpm: 90 }).ms, x: { seq } });
    },
    happy(tier, band) {
      const major = Math.random() < 0.5, root = pick([60, 62, 65, 67]), th = major ? 4 : 3;
      const ev = [0, th, 7, 12, 7, th, 0].map((s, n) => ({ m: root + s, b: n * 0.5, d: 0.5, inst: 'piano' })).concat([{ m: root, b: 3.6, d: 2, inst: 'piano' }, { m: root + th, b: 3.6, d: 2, inst: 'piano' }, { m: root + 7, b: 3.6, d: 2, inst: 'piano' }]);
      return Q({ skill: 'happy', key: 'h' + major + root, prompt: t('q_happy'), speak: speak4(band, t('q_happy')), answer: major ? 'happy' : 'sad', opts: [{ value: 'happy', label: t('a_happy'), pic: () => KQ.icon('☀️') }, { value: 'sad', label: t('a_sad'), pic: () => KQ.icon('🌧️') }], sound: () => M.seq(ev, { bpm: 92 }).ms, x: { major } });
    },
    tune(tier, band) {
      const pool = M.TUNES.filter(x => x.band <= Math.min(band, 4)), tu = pick(pool), others = shuffle(pool.filter(x => x !== tu)).slice(0, band >= 4 ? 3 : 2);
      return Q({ skill: 'tune', key: 't' + tu.id, prompt: t('q_tune'), answer: tu.id, opts: shuffle([tu, ...others]).map(x => ({ value: x.id, label: M.tuneText(x, lang()).title })), pic: hero(tu.inst), after: pieceBox(tu), sound: () => M.seq(tu.ev.filter(e => e.b < 9), { bpm: tu.bpm }).ms, x: { tu } });
    },
    composer(tier, band) {
      const named = M.TUNES.filter(x => !/Traditional|Hill/.test(x.en[1])), tu = pick(named), whos = [...new Set(named.map(x => x.en[1]))];
      const others = shuffle(whos.filter(w => w !== tu.en[1])).slice(0, 3), label = w => { const x = named.find(y => y.en[1] === w); return M.tuneText(x, lang()).who; };
      return Q({ skill: 'composer', key: 'cp' + tu.id, prompt: t('q_composer'), answer: tu.en[1], opts: shuffle([tu.en[1], ...others]).map(w => ({ value: w, label: label(w) })), after: pieceBox(tu), sound: () => M.seq(tu.ev.filter(e => e.b < 10), { bpm: tu.bpm }).ms, x: { tu } });
    },
    staff(tier, band) {
      const bass = band >= 5 && Math.random() < 0.5, pool = band === 3 ? ['C4', 'D4', 'E4', 'F4', 'G4', 'A4'] : band === 4 ? ['D4', 'E4', 'F4', 'G4', 'A4', 'B4', 'C5', 'D5', 'E5', 'F5'] : bass ? ['G2', 'A2', 'B2', 'C3', 'D3', 'E3', 'F3', 'G3', 'A3'] : ['A3', 'B3', 'C4', 'Fs4', 'Cs5', 'G5', 'A5', 'B5', 'C6'];
      const m = M.midi(pick(pool)), mode = band === 3 ? 'sol' : 'letter', nm = x => mode === 'sol' ? M.name(x, lang()) : M.name(x, lang(), 'letter') + ' · ' + M.name(x, lang());
      const cand = shuffle([...new Set(pool.map(M.midi).filter(x => x !== m).map(x => ((x % 12) + 12) % 12))].filter(pc => pc !== ((m % 12) + 12) % 12)).slice(0, 3).map(pc => pc + 60);
      const opts = shuffle([m, ...cand]).map(x => ({ value: String(((x % 12) + 12) % 12), label: nm(x) }));
      return Q({ skill: 'staff', key: 'st' + m + bass, prompt: t('q_staff'), answer: String(((m % 12) + 12) % 12), opts, pic: () => { const d = el('div', 'staffbox'); d.appendChild(M.staff([{ m }], { bass, w: 200 })); return d; }, sound: () => M.seq([{ m, b: 0, d: 1.5, inst: 'piano' }], { bpm: 80 }).ms, x: { m, bass, n: nm(m) } });
    },
    rhythm(tier, band) {
      if (band >= 4 && Math.random() < 0.5) { const vals = band >= 4 ? [2, 1, 1, 0.5, 0.5, 3, 4] : [2, 1]; const notes = []; let sum = 0; const len = ri(2, 4); while (notes.length < len) { const d = pick(vals.filter(v => v !== 4 || !notes.length)); notes.push(d); sum += d; }
        const opts = shuffle([...new Set([sum, sum + 1, Math.max(1, sum - 1), sum + 0.5].map(v => String(v)))]).slice(0, 3); if (!opts.includes(String(sum))) opts[0] = String(sum);
        return Q({ skill: 'rhythm', tags: ['bar'], key: 'rb' + notes.join(), prompt: t('q_bar'), answer: String(sum), opts: opts.sort((a, b) => a - b).map(v => ({ value: v, label: v })), pic: () => { const d = el('div', 'staffbox'); d.appendChild(M.staff(notes.map(n => ({ m: 71, d: n })))); return d; }, sound: () => { let b = 0; return M.seq(notes.map(n => { const e = { m: 71, b, d: n, inst: 'piano' }; b += n; return e; }), { bpm: 90 }).ms; }, x: { notes, sum } }); }
      const d = pick(band === 3 ? [4, 2, 1] : [4, 2, 1, 0.5, 3]);
      return Q({ skill: 'rhythm', tags: ['value'], key: 'rv' + d, prompt: t('q_beats'), answer: String(d), opts: (band === 3 ? [4, 2, 1] : [4, 3, 2, 1, 0.5]).map(v => ({ value: String(v), label: String(v).replace('0.5', '½') })), pic: () => { const b = el('div', 'staffbox'); b.appendChild(M.staff([{ m: 71, d }], { w: 160 })); return b; }, sound: () => M.seq([{ kind: 'hat', b: 0, d: 1 }, { kind: 'hat', b: 1, d: 1 }, { kind: 'hat', b: 2, d: 1 }, { kind: 'hat', b: 3, d: 1 }, { m: 71, b: 0, d, inst: 'piano' }], { bpm: 80 }).ms, x: { d } });
    },
    family(tier, band) {
      const i = pick(ALL), f = FAMILY[i], fams = ['strings', 'woodwind', 'brass', 'percussion', 'keys'];
      return Q({ skill: 'family', key: 'f' + i, prompt: t('q_family'), answer: f, opts: shuffle([f, ...shuffle(fams.filter(x => x !== f)).slice(0, 3)]).map(x => ({ value: x, label: t('f_' + x) })), pic: hero(i), sound: () => playInst(i), x: { i, f } });
    },
    interval(tier, band) {
      const set = band === 5 ? [2, 3, 5, 8] : [2, 3, 4, 5, 6, 8], k = pick(set), a = M.midi(pick(['C4', 'D4', 'F4', 'G4'])), b = a + IV[k];
      const opts = (set.length > 4 ? shuffle(set.filter(x => x !== k)).slice(0, 3).concat(k) : set).sort((x, y) => x - y).map(x => ({ value: String(x), label: t('iv_' + x) }));
      return Q({ skill: 'interval', key: 'iv' + k + a, prompt: t('q_interval'), answer: String(k), opts, pic: () => { const d = el('div', 'staffbox'); d.appendChild(M.staff([{ m: a }, { m: b }], { w: 220 })); return d; }, sound: () => M.seq([{ m: a, b: 0, d: 1, inst: 'piano' }, { m: b, b: 1.1, d: 1, inst: 'piano' }, { m: a, b: 2.4, d: 1.6, inst: 'piano' }, { m: b, b: 2.4, d: 1.6, inst: 'piano' }], { bpm: 84 }).ms, x: { k, a, b } });
    },
    chord(tier, band) {
      const kinds = band >= 6 ? ['major', 'minor', 'dim'] : ['major', 'minor'], k = pick(kinds), r = ri(55, 64), th = k === 'major' ? 4 : 3, fi = k === 'dim' ? 6 : 7;
      return Q({ skill: 'chord', key: 'ch' + k + r, prompt: t('q_chord'), answer: k, opts: kinds.map(x => ({ value: x, label: t(x === 'dim' ? 'a_dim' : 'a_' + x) })), sound: () => M.seq([{ m: r, b: 0, d: 0.6, inst: 'piano' }, { m: r + th, b: 0.6, d: 0.6, inst: 'piano' }, { m: r + fi, b: 1.2, d: 0.6, inst: 'piano' }, { m: r, b: 2, d: 2, inst: 'piano' }, { m: r + th, b: 2, d: 2, inst: 'piano' }, { m: r + fi, b: 2, d: 2, inst: 'piano' }], { bpm: 88 }).ms, x: { k } });
    },
    keysig(tier, band) {
      const [k, s, f] = pick(KEYS.slice(1)), kn = lang() === 'he' ? keyHe[k] : k, ans = keyLabel(s, f);
      const pool = [...new Set(KEYS.map(([, a, b]) => keyLabel(a, b)))]; const opts = shuffle([ans, ...shuffle(pool.filter(x => x !== ans)).slice(0, 3)]);
      return Q({ skill: 'keysig', key: 'k' + k, prompt: t('q_key', { k: kn }), answer: ans, opts: opts.map(x => ({ value: x, label: x })), sound: () => M.seq([0, 2, 4, 5, 7, 9, 11, 12].map((st, n) => ({ m: M.midi(k.replace('♭', 'b') + '4') + st, b: n * 0.5, d: 0.5, inst: 'piano' })), { bpm: 100 }).ms, x: { k: kn, s, f, ans } });
    }
  };

  const EXPLAIN = {
    who: q => [{ text: t('x_who', { i: lc(t('i_' + q.x.i)), how: t('how_' + q.x.i) }), vis: { el: M.art(q.x.i) }, big: true }],
    highlow: q => [{ text: t('x_high', { a: lc(t('a_' + q.x.ans)) }), big: true }],
    count: q => [{ text: t('x_count', { seq: Array.from({ length: q.x.n }, (_, k) => k + 1).join(', ') }), big: true }],
    loudfast: q => [{ text: t(q.x.kind === 'loud' ? 'x_loud' : 'x_fast'), big: true }],
    echo: q => [{ text: t('x_echo', { seq: q.x.seq.map(k => M.name([0, 2, 4, 5, 7, 9, 11, 0][k], lang())).join(' – ') }), vis: { el: barsPic(q.x.seq, true)() }, big: true }],
    happy: () => [{ text: t('x_happy'), big: true }],
    tune: q => { const T = M.tuneText(q.x.tu, lang()); return [{ text: t('x_piece', T), big: true }]; },
    composer: q => { const T = M.tuneText(q.x.tu, lang()); return [{ text: t('x_piece', T), big: true }]; },
    staff: q => [{ text: t(q.x.bass ? 'x_staffB' : 'x_staff', { n: q.x.n }), big: true }],
    rhythm: q => q.x.notes ? [{ text: t('x_beats') }, { text: t('x_bar', { sum: q.x.notes.map(String).join(' + ').replace(/0\.5/g, '½'), n: q.x.sum }), big: true }] : [{ text: t('x_beats'), big: true }],
    family: q => [{ text: t('x_family', { i: lc(t('i_' + q.x.i)), f: lc(t('f_' + q.x.f)) }), vis: { el: M.art(q.x.i) }, big: true }],
    interval: q => { const L = []; for (let m = q.x.a, s = 0; s <= q.x.k - 1; s++) { L.push(M.name(m, lang(), 'letter')); m += [2, 2, 1, 2, 2, 2, 1][(([0, 2, 4, 5, 7, 9, 11].indexOf(((m % 12) + 12) % 12)) + 7) % 7]; } return [{ text: t('x_interval', { seq: L.join(' – '), n: lc(t('iv_' + q.x.k)) }), big: true }]; },
    chord: () => [{ text: t('x_chord'), big: true }],
    keysig: q => [{ text: t('x_key', { k: q.x.k, n: q.x.ans, list: q.x.s ? SHARP_ORDER.slice(0, q.x.s).join(' ') : q.x.f ? FLAT_ORDER.slice(0, q.x.f).join(' ') : '—' }), big: true }]
  };

  KQ.quest.shell();
  const api = KQ.quest({ world: 'music', title: 'mh_title', sub: 'mh_sub', bands: { 1: ['who', 'highlow', 'count', 'loudfast'], 2: ['who', 'echo', 'highlow', 'happy'], 3: ['tune', 'staff', 'echo', 'rhythm'], 4: ['tune', 'staff', 'rhythm', 'family'], 5: ['composer', 'staff', 'interval', 'chord'], 6: ['composer', 'interval', 'chord', 'keysig'] },
    bandKey: 'band', icons: { who: '🎸', highlow: '🪜', count: '🥁', loudfast: '🦁', echo: '🔔', happy: '☀️', tune: '📯', staff: '📝', rhythm: '⏱️', family: '👥', composer: '🎓', interval: '📏', chord: '🧩', keysig: '🔑' },
    n: 8, fastMs: 9000, speakBands: [1, 2], gen: GEN, explain: EXPLAIN });
  /* warm the instruments the first rounds need */
  ['piano', 'xylophone', 'drums'].forEach(i => M.load(i));
  /* the Music Creator card on top of the pick screen */
  function creatorCard() {
    const pick = document.getElementById('pick'); if (!pick || document.querySelector('.mc-card')) return;
    const b = el('button', 'mc-card'); b.type = 'button'; const row = el('div', 'row'); ['piano', 'violin', 'cello', 'drums'].forEach(i => row.appendChild(M.art(i))); b.appendChild(row);
    const tx = el('div'); tx.appendChild(el('b', null, t('mc_card'))); tx.appendChild(el('span', null, t('mc_cardSub'))); b.appendChild(tx);
    b.onclick = () => window.KQCreator && KQCreator.open(api && api.R ? api.R.band : 1);
    pick.prepend(b);
    /* the Instrument Hall: every instrument's painted page, its notes, a sample recorder and the song builder */
    const h = el('button', 'mc-card ih-entry'); h.type = 'button'; const hr = el('div', 'row'); ['violin', 'saxophone', 'french-horn', 'guitar-electric'].forEach(i => hr.appendChild(M.art(i))); h.appendChild(hr);
    const ht = el('div'); ht.appendChild(el('b', null, t('ih_card'))); ht.appendChild(el('span', null, t('ih_cardSub'))); h.appendChild(ht);

    const mt = el('div'); mt.appendChild(el('b', null, t('band_card'))); mt.appendChild(el('span', null, t('band_cardSub'))); mb.appendChild(mt);

    const ws = el('button', 'mc-card ih-entry ws-entry'); ws.type = 'button'; const wr = el('div', 'row'); ['voice-f', 'guitar-electric', 'piano', 'drums'].forEach(i => wr.appendChild(M.art(i))); ws.appendChild(wr);
    const wt = el('div'); wt.appendChild(el('b', null, t('ws_card'))); wt.appendChild(el('span', null, t('ws_cardSub'))); ws.appendChild(wt);
    ws.onclick = () => { if (!window.KQHall) return; KQHall.open(api && api.R ? api.R.band : 1); KQHall.workshop(); }; b.after(ws);
  }

  document.addEventListener('kq:lang', () => { document.querySelectorAll('.mc-card').forEach(c => c.remove()); creatorCard(); });
  window.__music = { GEN, api };
})();
