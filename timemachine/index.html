:root{ --accent:#7a5ad8; --accent-2:#3a2a7a; }
.bands{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}

.tq{display:grid; gap:12px; justify-items:center; width:100%}
.tq .scene{width:min(78vw,300px); border-radius:14px; overflow:hidden; box-shadow:0 8px 24px rgba(0,0,0,.4); background:#fff}
.tq .scene svg{display:block; width:100%; height:auto} .tq .scene .kq-i{width:96px; height:96px; margin:22px auto; display:block}
.tq .choices{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; width:100%}
.tq .choice{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; min-height:56px; font-weight:800}
.tq .choice .kq-i{width:58px; height:58px} .tq .choice .mini{width:130px; border-radius:10px; overflow:hidden} .tq .choice .mini svg{display:block; width:100%; height:auto} .tq .choice .mini .kq-i{width:56px; height:56px; margin:12px auto; display:block}
.tq .choice.ok{outline:4px solid #3ecf7a} .tq .choice.bad{outline:4px solid #ff5a6a; opacity:.8}
.tq .order{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}
.tq .order button{width:140px; padding:6px; border-radius:14px; border:2px solid rgba(255,255,255,.25); background:rgba(255,255,255,.08); cursor:pointer; display:grid; gap:4px; color:inherit; font:700 13px var(--font-body)}
.tq .order button .mini{border-radius:8px; overflow:hidden} .tq .order button .mini svg{display:block; width:100%; height:auto} .tq .order button .mini .kq-i{width:56px; height:56px; margin:10px auto; display:block}
.tq .order button.done{opacity:.3}
.tq .rail{display:flex; gap:6px; justify-content:center; flex-wrap:wrap; padding:8px; border-radius:14px; background:rgba(255,255,255,.06)}
.tq .rail .slot{width:120px; min-height:84px; border-radius:12px; border:3px dashed rgba(255,224,138,.5); display:grid; place-items:center; font:800 12px var(--font-body); padding:4px; text-align:center}
.tq .rail .slot .mini{width:100%; border-radius:8px; overflow:hidden} .tq .rail .slot svg{display:block; width:100%; height:auto} .tq .rail .slot .kq-i{width:44px; height:44px}
.tq .yr{font:900 15px var(--font-body); color:#ffe08a}
.tm-card{display:flex; align-items:center; gap:14px; width:100%; margin:0 0 12px; padding:12px 14px; border-radius:18px; cursor:pointer; text-align:start; border:1px solid rgba(200,180,255,.55); background:linear-gradient(135deg,rgba(122,90,216,.4),rgba(40,120,200,.3)); color:inherit; font:inherit}
.tm-card .thumbs{display:flex; gap:4px} .tm-card .thumbs .mini{width:58px; border-radius:6px; overflow:hidden} .tm-card .thumbs svg{display:block; width:100%; height:auto}
.tm-card b{display:block; font:800 20px/1.1 Cinzel, 'Frank Ruhl Libre', serif} .tm-card span{font-size:14px; opacity:.85}
.tl{position:fixed; inset:0; z-index:40; overflow:auto; padding:calc(14px + env(safe-area-inset-top,0px)) 16px 24px; background:radial-gradient(120% 90% at 50% 0%, #2a1a5a, #0a0818 70%); color:#f2ecff; display:flex; flex-direction:column; gap:12px}
.tl > *{flex-shrink:0} .tl-head{display:flex; align-items:center; gap:12px} .tl-head h2{margin:0; flex:1; font:900 clamp(22px,4vw,32px) Cinzel, 'Frank Ruhl Libre', serif; color:#e0d0ff}
.tl-x{width:44px; height:44px; border-radius:50%; border:0; background:rgba(255,255,255,.14); color:#fff; font:400 28px/1 sans-serif; cursor:pointer}
.tl-era{display:grid; gap:8px; padding:12px; border-radius:16px; background:rgba(255,255,255,.05); border-inline-start:4px solid #b48cff} .tl-era h3{margin:0; color:#ffe08a; font:800 18px var(--font-body)}
.tl-row{display:grid; grid-template-columns:120px 1fr; gap:12px; align-items:center} .tl-row .mini{border-radius:10px; overflow:hidden} .tl-row svg{display:block; width:100%; height:auto} .tl-row .kq-i{width:60px; height:60px; margin:8px auto; display:block}
.tl-row b{display:block; color:#ffe08a} .tl-row span{opacity:.92}

    century(tier, band) { const ev = pick(EV.filter(e => e.y > 0)), c = cen(ev.y), set = shuffle([c - 1, c + 1, c - 2, c + 2].filter(x => x >= 1 && x <= 21)).slice(0, 3);
      return Q({ skill: 'century', key: 'c' + ev.id, prompt: t('q_century', { ev: L(ev.n), y: ev.y }), wordy: true, answer: String(c), opts: shuffle([c, ...set]).map(x => ({ value: String(x), label: cenName(x) })), pic: () => { const d = el('div', 'scene'); d.appendChild(scene(ev)); return d; }, x: { ev, c } }); },
    era(tier, band) { const ev = pick(EV), others = shuffle(Object.keys(ERAS).filter(k => k !== ev.era)).slice(0, 3);
      return Q({ skill: 'era', key: 'er' + ev.id, prompt: t('q_era', { ev: L(ev.n) }), wordy: true, answer: ev.era, opts: shuffle([ev.era, ...others]).map(k => ({ value: k, label: L(ERAS[k][0]).replace(/^the /, 'The ') })), pic: () => { const d = el('div', 'scene'); d.appendChild(scene(ev)); return d; }, x: { ev } }); },
    howlong(tier, band) { let a, b, g = 0; do { [a, b] = shuffle(EV.filter(e => e.y > 0)).slice(0, 2); } while (a.y === b.y && ++g < 20); if (a.y > b.y) [a, b] = [b, a]; const n = b.y - a.y, set = [...new Set([n + 10, n - 10, n + 100, n - 1, n + 1].filter(x => x > 0 && x !== n))]; const opts = shuffle([n, ...shuffle(set).slice(0, 3)]);
      return Q({ skill: 'howlong', key: 'hl' + a.id + b.id, prompt: t('q_howlong', { a: L(a.n), ya: a.y, b: L(b.n), yb: b.y }), wordy: true, answer: String(n), opts: opts.map(x => ({ value: String(x), label: String(x) })), x: { a, b, n } }); },
    bce(tier, band) { const evs = shuffle(EV.filter(e => e.y < 0 && e.y > -10000).concat(shuffle(EV.filter(e => e.y > 0)).slice(0, 1))).slice(0, 4); return orderQ('bce', evs, band, true); }
  };
  const big = text => [{ text, big: true }];
  const EXPLAIN = {
    oldnew: q => q.x.pair ? big(t('x_thennow', { a: L(q.x.pair[2]), b: L(q.x.pair[3]) })) : big(t('x_oldnew', { a: L(q.x.a.n), ya: yearTxt(q.x.a.y), b: L(q.x.b.n), yb: yearTxt(q.x.b.y) })),
    thennow: q => big(t('x_thennow', { a: L(q.x.p[2]), b: L(q.x.p[3]) })),
    order: q => big(t('x_order', { list: q.x.right.map(e => L(e.n) + ' (' + yearTxt(e.y) + ')').join(he() ? ' ← ' : ' → ') })),
    who: q => big(t('x_who', { who: L(q.x.w[1]), did: L(q.x.w[2]) })),
    century: q => big(t('x_century', { from: (q.x.c - 1) * 100 + 1, to: q.x.c * 100, cen: cenName(q.x.c), y: q.x.ev.y })),
    era: q => big(t('x_era', { ev: L(q.x.ev.n), era: L(ERAS[q.x.ev.era][0]), span: L(ERAS[q.x.ev.era][1]) })),
    howlong: q => big(t('x_howlong', { ya: q.x.a.y, yb: q.x.b.y, n: q.x.n })),
    bce: q => big(t('x_bce', { list: q.x.right.map(e => yearTxt(e.y)).join(he() ? ' ← ' : ' → ') }))
  };
  KQ.quest.shell();
  const api = KQ.quest({ world: 'timemachine', title: 'tm_title', sub: 'tm_sub', bands: { 1: ['oldnew', 'thennow'], 2: ['order', 'thennow', 'oldnew'], 3: ['order', 'who', 'thennow'], 4: ['century', 'who', 'order'], 5: ['era', 'howlong', 'century'], 6: ['era', 'howlong', 'bce'] },
    bandKey: 'band', icons: { oldnew: '⏳', thennow: '🕯️', order: '📅', who: '🔭', century: '🕰️', era: '🏛️', howlong: '🧮', bce: '📜' }, n: 8, fastMs: 12000, speakBands: [1, 2], gen: GEN, explain: EXPLAIN });
  /* the Timeline tour: every moment, age by age, oldest first */
  function tour() {
    const root = el('div', 'tl'); root.setAttribute('role', 'dialog'); document.body.appendChild(root);
    const hd = el('div', 'tl-head'); hd.appendChild(el('h2', null, t('tm_card'))); const x = el('button', 'tl-x', '×'); x.type = 'button'; x.onclick = () => root.remove(); hd.appendChild(x); root.appendChild(hd);
    for (const k of Object.keys(ERAS)) { const evs = EV.filter(e => e.era === k).sort((a, b) => a.y - b.y); if (!evs.length) continue; const sec = el('div', 'tl-era'); sec.appendChild(el('h3', null, L(ERAS[k][0]).replace(/^the /, 'The ') + ' · ' + L(ERAS[k][1])));
      evs.forEach(ev => { const r = el('div', 'tl-row'); r.appendChild(scene(ev)); const tx = el('div'); tx.appendChild(el('b', null, yearTxt(ev.y))); tx.appendChild(el('span', null, L(ev.n))); r.appendChild(tx); sec.appendChild(r); }); root.appendChild(sec); }
  }
  function card() { const pk = document.getElementById('pick'); if (!pk || document.querySelector('.tm-card')) return; const b = el('button', 'tm-card'); b.type = 'button'; const th = el('div', 'thumbs'); ['trex', 'pyramid', 'moon'].forEach(id => th.appendChild(scene(EV.find(e => e.id === id)))); b.appendChild(th); const tx = el('div'); tx.appendChild(el('b', null, t('tm_card'))); tx.appendChild(el('span', null, t('tm_cardSub'))); b.appendChild(tx); b.onclick = tour; pk.prepend(b); }
  card(); document.addEventListener('kq:lang', () => { const c = document.querySelector('.tm-card'); if (c) c.remove(); card(); });
  window.__time = { GEN, api, EV };
})();
