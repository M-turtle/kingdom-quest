<style>
:root{ --accent:#2a7ad8; --accent-2:#123a6a; }
.bands{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
@media (max-width:600px){ .bands{grid-template-columns:1fr} }
.eq{display:grid; gap:12px; justify-items:center; width:100%}
.eq .mapbox{width:min(94vw,560px)} .kqg-map{width:100%; height:auto; display:block; border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.4)}
.eq .hero .kq-i{width:min(30vw,130px); height:min(30vw,130px)}
.eq .bigflag .kqg-flag{width:min(46vw,200px); height:auto; display:block; border-radius:6px; box-shadow:0 6px 18px rgba(0,0,0,.4)}
.eq .choices{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; width:100%}
.eq .choice{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; min-height:56px; font-weight:800}
.eq .choice .kq-i{width:54px; height:54px} .eq .choice .kqg-flag{width:90px; height:auto; border-radius:4px}
.eq .choice.ok{outline:4px solid #3ecf7a} .eq .choice.bad{outline:4px solid #ff5a6a; opacity:.8}
.tp-card{display:flex; align-items:center; gap:14px; width:100%; margin:0 0 12px; padding:12px 14px; border-radius:18px; cursor:pointer; text-align:start; border:1px solid rgba(160,210,255,.55); background:linear-gradient(135deg,rgba(42,122,216,.4),rgba(30,140,120,.3)); color:inherit; font:inherit}
.tp-card .thumbs{display:flex; gap:2px} .tp-card .kq-i{width:44px; height:44px} .tp-card b{display:block; font:800 20px/1.1 Cinzel, 'Frank Ruhl Libre', serif} .tp-card span{font-size:14px; opacity:.85}
.tp{position:fixed; inset:0; z-index:40; overflow:auto; padding:calc(14px + env(safe-area-inset-top,0px)) 16px 24px; background:radial-gradient(120% 90% at 50% 0%, #123a6a, #06101e 70%); color:#eaf4ff; display:flex; flex-direction:column; gap:12px}
.tp > *{flex-shrink:0} .tp-head{display:flex; align-items:center; gap:12px} .tp-head h2{margin:0; flex:1; font:900 clamp(22px,4vw,32px) Cinzel, 'Frank Ruhl Libre', serif; color:#bfe0ff}
.tp-x{width:44px; height:44px; border-radius:50%; border:0; background:rgba(255,255,255,.14); color:#fff; font:400 28px/1 sans-serif; cursor:pointer}
.tp-say{padding:10px 14px; border-radius:14px; background:rgba(255,224,138,.14); border:1px solid rgba(255,224,138,.5); font:700 17px/1.4 var(--font-body)}
.tp-row{display:flex; gap:8px; flex-wrap:wrap; justify-content:center} .tp-city{padding:8px 12px; border-radius:999px; border:1px solid rgba(255,255,255,.3); background:rgba(255,255,255,.08); color:#fff; font:700 14px var(--font-body); cursor:pointer} .tp-city.on{background:#ffd23a; color:#1a2a3a}
.tp-veh{display:flex; gap:12px; justify-content:center} .tp-veh button{display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 18px; border-radius:16px; border:2px solid rgba(255,255,255,.2); background:rgba(255,255,255,.08); color:#fff; font:800 15px var(--font-body); cursor:pointer} .tp-veh .kq-i{width:56px; height:56px}
.tp-pass{display:flex; gap:10px; flex-wrap:wrap; padding:12px; border-radius:16px; background:#3a2a1a; border:2px solid #8a6a3a} .tp-pass h3{width:100%; margin:0; color:#ffe7a8; font:800 18px Cinzel, serif}
.tp-stamp{display:grid; justify-items:center; gap:2px; padding:6px; border-radius:10px; border:2px dashed #c8a060; transform:rotate(-4deg); font:800 12px var(--font-body); color:#ffe7a8} .tp-stamp .kqg-flag{width:52px; height:auto}

  };

  const EXPLAIN = {

    where: q => big(t('x_where', { c: contName(q.x.k) })), compass: q => big(t('x_compass', { a: cn(q.x.a), b: cn(q.x.b), d: lc(t('a_' + q.x.d)) })),
    capital: q => big(t('x_capital', { c: country(q.x.cc), cap: L(G.CAPITAL[q.x.cc]) })), ocean: q => big(t('x_ocean', { o: L(G.OCEANS[q.x.k][0]) })),
    equator: q => big(t('x_equator', { a: cn(q.x.c), d: lc(t('a_' + q.x.d)) })), latlong: q => big(t('x_latlong', { city: cn(q.x.c), lat: fmtLat(q.x.c.lat), lon: fmtLon(q.x.c.lon) }))

  KQ.quest.shell();
  const api = KQ.quest({ world: 'explore', title: 'we_title', sub: 'we_sub', bands: { 1: ['landsea', 'vehicle'], 2: ['continent', 'flag', 'rail'], 3: ['trip', 'where', 'continent'], 4: ['compass', 'capital', 'trip'], 5: ['ocean', 'equator', 'capital'], 6: ['latlong', 'ocean', 'capital'] },

  /* the Trip planner: from → to, choose how, the real rules decide; every arrival stamps the passport */
  const store = () => { const st = KQ.state(); st.explore = st.explore || {}; const pid = (KQ.profiles.active() || {}).id || 'guest'; return (st.explore[pid] = st.explore[pid] || { stamps: [] }); };

      const msg = t('tp_go_' + k, { a: cn(from), b: cn(to) }) + (fresh ? ' ' + t('tp_stamp', { c: cn(to) }) : ''); draw(msg, true, k); say(msg); from = to; to = null;
