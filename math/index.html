<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Math Tower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;800&family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&family=Rubik:wght@500;700;900&family=Secular+One&display=swap">
<link rel="stylesheet" href="../shared/kq.css?v=26">
<style>
:root{ --accent:#2b5fa8; --accent-2:#1a3c6e; }
.bands{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
@media (max-width:700px){ .bands{grid-template-columns:repeat(2,1fr)} }
.tile .m{width:100%; display:grid; gap:3px} .tile .m small{font-size:11px; color:var(--muted); font-weight:700}
.qtools{display:flex; justify-content:center; gap:10px; margin-top:14px; flex-wrap:wrap}
.howto.path{border-color:var(--gold-2); box-shadow:0 0 0 3px color-mix(in srgb, var(--gold) 35%, transparent)}
.howto.path .sub{font-size:14px; color:var(--muted); font-weight:700; margin:2px 0 8px}
.howto.path .pprompt{font:800 clamp(20px,4.2vw,28px)/1.3 var(--font-body); margin:6px 0 10px}
.howto.path .choices{margin-top:8px}
</style>
<link rel="stylesheet" href="../shared/skin.css?v=6">
</head>
<body>
<div class="kq-wrap">
  <header class="kq-header"></header>
  <main class="play" style="margin-top:18px">
    <div id="potions"></div>
    <section class="card" id="pick">
      <h2 data-i18n="ageBand">Age</h2>
      <div class="bands" id="bands"></div>
      <div class="sec" style="margin-top:18px" data-i18n="m_skill">Choose a challenge</div>
      <div class="tiles" id="skills"></div>
    </section>

    <section class="card" id="round" hidden>
      <div class="rhead"><button class="back" id="btnQuit" type="button"><span class="chev">‹</span><span data-i18n="back">Back</span></button><div class="prog"><div class="qbar" id="qbar"><i></i></div><span class="qcount" id="qcount"></span></div><div class="pill" id="skillName"></div><div class="dots" id="dots" hidden></div><div class="streak" id="streak" hidden></div></div>
      <div class="qcard">
        <div class="visual" id="visual" hidden></div>
        <div class="prompt" id="prompt"></div>
        <div id="answerBox" hidden><div class="answer" id="answer">&nbsp;</div></div>
        <div class="feedback" id="feedback"></div>
        <div class="choices" id="choices" hidden></div>
        <div class="numpad" id="numpad" hidden></div>
        <div class="muted" id="fracHint" hidden data-i18n="m_fracHint">Use . for a point and / for a fraction</div>
        <div class="qtools"><button class="btn gold sm" id="btnHow">💡 <span data-i18n="howTo">How?</span></button><button class="ibtn" id="btnSpeak" title="🔊">🔊</button></div>
        <div id="howto"></div>
      </div>
    </section>
  </main>
</div>

    longdiv(tier) { const b = ri(3, tier === 0 ? 6 : 9), q = ri(4, tier === 0 ? 12 : 30), r = ri(1, b - 1); const a = b * q + r; return { prompt: t('m_rem', { a, b }), answer: q, choices: null, speak: t('m_rem', { a, b }), tags: ['remainder', 'div', 'd' + b], x: { a, b, q, r } }; },
    fracadd(tier) {
      if (Math.random() < 0.5) { const d = pick([2, 3, 4, 5, 6]), n = ri(1, d - 1), one = ri(2, tier === 0 ? 6 : 12), total = one * d; return { prompt: t('m_fracOf', { n, d, t: total }), answer: n * one, choices: null, speak: t('m_fracOf', { n, d, t: total }), tags: ['fracof'], x: { n, d, t: total, one, r: n * one, kind: 'fracof' } }; }
      const g = pick([2, 3, 4]), d2 = pick([2, 3, 4, 5]), n2 = ri(1, d2 - 1);
      return { prompt: t('m_simplify', { n: n2 * g, d: d2 * g }), answer: n2 + '/' + d2, choices: null, speak: t('m_simplify', { n: n2 * g, d: d2 * g }), tags: ['simplify'], fracAnswer: true, x: { n: n2 * g, d: d2 * g, g, n2, d2, kind: 'simplify' } };
    },
    decimals(tier) { const a = (ri(1, tier === 0 ? 9 : 40) + ri(1, 9) / 10), b = (ri(1, tier === 0 ? 9 : 40) + ri(1, 9) / 10); const r = Math.round((a + b) * 10) / 10; return { prompt: `${a.toFixed(1)} + ${b.toFixed(1)} = ?`, answer: r, choices: null, speak: t('m_decAdd'), tags: ['decimals'], x: { a: a.toFixed(1), b: b.toFixed(1), r, kind: 'dec' } }; },
    fraccmp() { const fr = [[1, 2], [1, 3], [1, 4], [2, 3], [3, 4], [2, 5], [3, 5], [1, 5], [5, 6], [1, 6]]; let A = pick(fr), B = pick(fr); while (A[0] / A[1] === B[0] / B[1]) B = pick(fr); const a = `${A[0]}/${A[1]}`, b = `${B[0]}/${B[1]}`; return { prompt: t('m_bigger'), answer: A[0] / A[1] > B[0] / B[1] ? a : b, choices: [a, b], speak: t('m_bigger'), bigChoices: true, tags: ['fraccmp'], x: { A, B, a, b } }; },
    order(tier) { const a = ri(1, 9), b = ri(2, tier === 0 ? 5 : 9), c = ri(2, 9); const k = pick(['+×', '−×', '+÷']); if (k === '+÷') { const d = b * c; return { prompt: `${a} + ${d} ÷ ${b} = ?`, answer: a + c, choices: null, speak: t('m_solve'), tags: ['order'], x: { part: `${d} ÷ ${b}`, v: c, rest: `${a} + ${c}` } }; } if (k === '−×') { const p = b * c, base = p + ri(1, 9); return { prompt: `${base} − ${b} × ${c} = ?`, answer: base - p, choices: null, speak: t('m_solve'), tags: ['order'], x: { part: `${b} × ${c}`, v: p, rest: `${base} − ${p}` } }; } return { prompt: `${a} + ${b} × ${c} = ?`, answer: a + b * c, choices: null, speak: t('m_solve'), tags: ['order'], x: { part: `${b} × ${c}`, v: b * c, rest: `${a} + ${b * c}` } }; },
    word(tier) { const k = ri(1, 5); const a = ri(3, tier === 0 ? 12 : 40), b = ri(2, tier === 0 ? 8 : 20), c = ri(2, 9); let ans, text, x; if (k === 1) { ans = a + b; text = t('w1', { name, a, b }); x = { nums: `${a}, ${b}`, kw: t('kw1'), op: t('op_add'), expr: `${a} + ${b}`, tag: 'wordadd' }; } else if (k === 2) { const A = a + b; ans = A - b; text = t('w2', { a: A, b }); x = { nums: `${A}, ${b}`, kw: t('kw2'), op: t('op_sub'), expr: `${A} − ${b}`, tag: 'wordsub' }; } else if (k === 3) { const A = ri(2, 6), B = ri(2, tier === 0 ? 5 : 9); ans = A * B; text = t('w3', { a: A, b: B }); x = { nums: `${A}, ${B}`, kw: t('kw3'), op: t('op_mul'), expr: `${A} × ${B}`, tag: 'wordmul' }; } else if (k === 4) { const B = ri(2, 6), Q = ri(2, 8); ans = Q; text = t('w4', { a: B * Q, b: B }); x = { nums: `${B * Q}, ${B}`, kw: t('kw4'), op: t('op_div'), expr: `${B * Q} ÷ ${B}`, tag: 'worddiv' }; } else { ans = b + c; text = t('w5', { name, a: a + b + c, b, c }); x = { nums: `${b}, ${c}`, kw: t('kw5'), op: t('op_add'), expr: `${b} + ${c}`, tag: 'wordadd' }; } return { prompt: text, answer: ans, choices: null, speak: text, wordy: true, tags: ['word', x.tag], x }; }
  };
  // How each kind of question is actually solved — the same strategy a teacher would show, with a picture per step.
  const EXPLAIN = {
    percent: q => [{ text: t('x_pct', { p: q.x.p, n: q.x.n, a: q.x.a }), big: true }],
    negatives: q => [{ text: t('x_neg', { a: q.x.a, op: q.x.op, b: q.x.b, ans: q.x.ans }), big: true }],
    fracmul: q => [{ text: t('x_fracmul', { n: q.x.n, d: q.x.dd, ans: q.x.ans }), big: true }],
    decmul: q => [{ text: t('x_decmul', { a: q.x.a, b: q.x.b, ans: q.x.ans }), big: true }],
    ratio: q => [{ text: t('x_ratio', { g: q.x.g, ans: q.x.ans }), big: true }],
    area: q => [{ text: t(q.x.per ? 'x_perim' : 'x_area', { w: q.x.w, h: q.x.h, ans: q.answer }), big: true }],
    lineq: q => [{ text: t('x_lineq1', { b: q.x.b, r: q.x.r, v: q.x.r - q.x.b }) }, { text: t('x_lineq2', { a: q.x.a, v: q.x.r - q.x.b, x: q.x.x }), big: true }],
    lineq2: q => [{ text: t('x_lineq3', { c: q.x.c, a: q.x.a - q.x.c, b: q.x.b, d: q.x.d }) }, { text: t('x_lineq2', { a: q.x.a - q.x.c, v: q.x.d - q.x.b, x: q.x.x }), big: true }],
    expo: q => [{ text: q.x.root ? t('x_root', { r: q.x.root, sq: q.x.sq }) : t('x_pow', { b: q.x.b, e: q.x.e, ans: q.x.ans }), big: true }],
    pythag: q => [{ text: t('x_pyth', { a: q.x.a, b: q.x.b, s: q.x.a * q.x.a + q.x.b * q.x.b, c: q.x.c }), big: true }],
    expand: q => [{ text: t('x_expand', { a: q.x.a, b: q.x.b, ans: q.x.ans }), big: true }],
    pctchange: q => [{ text: t('x_pctchange', { n: q.x.n, p: q.x.p, part: q.x.n * q.x.p / 100, ans: q.x.ans }), big: true }],
    mean: q => [{ text: t('x_mean', { sum: q.x.sum, k: q.x.k, mean: q.x.mean }), big: true }],

    count: q => [{ text: t('x_count1'), vis: { type: 'dots', groups: [{ n: q.x.n, hl: q.x.n }] } }, { text: t('x_count2', { n: q.x.n }), big: true }],
    compare: q => { const { a, b } = q.x, big = Math.max(a, b), small = Math.min(a, b); return [{ text: t('x_cmp1', { a }), vis: { type: 'dots', groups: [{ n: a, color: 'a' }] } }, { text: t('x_cmp2', { b }), vis: { type: 'dots', groups: [{ n: b, color: 'b' }] } }, { text: t('x_cmp3', { big, small }), big: true }]; },
    addPic: q => EXPLAIN.add20(q),
    add20: q => { const { a, b } = q.x, s = a + b; if (s <= 10) return [{ text: t('x_add_start', { a }), vis: { type: 'dots', groups: [{ n: a, color: 'a' }] } }, { text: t('x_add_on', { b, seq: up(a, b) }), vis: { type: 'dots', groups: [{ n: a, color: 'a' }, { n: b, color: 'b' }] } }, { text: `${a} + ${b} = ${s}`, big: true }]; const k = 10 - a, r = b - k; return [{ text: t('x_ten1', { a, k }), vis: { type: 'tenframe', a, b: 0 } }, { text: t('x_ten2', { k, b, r }), vis: { type: 'tenframe', a, b } }, { text: t('x_ten3', { r, s }), big: true }]; },
    sub20: q => { const { a, b } = q.x, d = a - b; if (b <= 3) return [{ text: t('x_sub_back', { a, b, seq: down(a, b) }), vis: { type: 'dots', groups: [{ n: a, color: 'a', cross: b }] } }, { text: `${a} − ${b} = ${d}`, big: true }]; return [{ text: t('x_sub_think', { a, b }) }, { text: t('x_sub_up', { b, a, seq: up(b, d) }), vis: { type: 'numline', from: 0, to: Math.max(a + 1, 10), marks: [b, a], jumps: [[b, a]] } }, { text: t('x_sub_res', { d, a, b }), big: true }]; },
    missing: q => { const { a, s } = q.x, k = s - a; return [{ text: t('x_miss1', { a, s, seq: up(a, k) }), vis: { type: 'numline', from: 0, to: Math.max(s + 1, 10), marks: [a, s], jumps: [[a, s]] } }, { text: t('x_miss2', { k, a, s }), big: true }]; },
    double: q => { const { a } = q.x; return [{ text: t('x_dbl1', { a }), vis: { type: 'dots', groups: [{ n: a, color: 'a' }, { n: a, color: 'b' }] } }, { text: t('x_dbl2', { a, seq: up(a, a) }) }, { text: `${a} + ${a} = ${a * 2}`, big: true }]; },
    tens: q => { const { a, b } = q.x, at = a / 10, bt = b / 10; return [{ text: t('x_tens1', { a, at, b, bt }), vis: { type: 'groups', groups: at + bt, each: 10 } }, { text: t('x_tens2', { at, bt, st: at + bt, s: a + b }), big: true }]; },
    add100: q => { const { a, b } = q.x, a1 = a % 10, b1 = b % 10, a2 = Math.floor(a / 10), b2 = Math.floor(b / 10), o = a1 + b1, carry = o >= 10; const tt = a2 + b2 + (carry ? 1 : 0); return [{ text: t('x_col_ones', { a1, b1, o }) + (carry ? ' ' + t('x_col_carry') : ''), vis: { type: 'column', a, b, op: '+', carry: carry ? '1' : '' } }, { text: t('x_col_tens', { a2, b2, c: carry ? ' + 1' : '', tt }), vis: { type: 'column', a, b, op: '+', carry: carry ? '1' : '', res: a + b } }, { text: `${a} + ${b} = ${a + b}`, big: true }]; },
    sub100: q => { const { a, b } = q.x, a1 = a % 10, b1 = b % 10, a2 = Math.floor(a / 10), b2 = Math.floor(b / 10), borrow = a1 < b1; if (!borrow) return [{ text: t('x_col_sub_ones', { a1, b1, o: a1 - b1 }), vis: { type: 'column', a, b, op: '−' } }, { text: t('x_col_sub_tens', { a2, b2, tt: a2 - b2 }), vis: { type: 'column', a, b, op: '−', res: a - b } }, { text: `${a} − ${b} = ${a - b}`, big: true }]; return [{ text: t('x_bor1', { a1, b1 }), vis: { type: 'column', a, b, op: '−', carry: (a2 - 1) + ' ' + (a1 + 10) } }, { text: t('x_bor2', { a1p: a1 + 10, b1, o: a1 + 10 - b1 }) }, { text: t('x_bor3', { a2m: a2 - 1, b2, tt: a2 - 1 - b2 }), vis: { type: 'column', a, b, op: '−', carry: (a2 - 1) + ' ' + (a1 + 10), res: a - b } }, { text: `${a} − ${b} = ${a - b}`, big: true }]; },
    times: q => { const { a, b } = q.x; return [{ text: t('x_mul1', { a, b }), vis: { type: 'array', rows: a, cols: b } }, { text: t('x_mul2', { b, seq: up(0, a, b) }), vis: { type: 'array', rows: a, cols: b, rowLabels: Array.from({ length: a }, (_, i) => (i + 1) * b) } }, { text: `${a} × ${b} = ${a * b}`, big: true }]; },
    divide: q => { const { n, b, q: qq } = q.x; return [{ text: t('x_div1', { n, b }), vis: { type: 'groups', groups: b, each: qq } }, { text: t('x_div2', { q: qq, b, n }), big: true }]; },
    fracadd: q => { const x = q.x;
      if (x.kind === 'fracof') return [{ text: t('x_fo1', { n: x.n, d: x.d, t: x.t }), vis: { type: 'groups', groups: x.d, each: x.one } }, { text: t('x_fo2', { t: x.t, d: x.d, one: x.one }) }, { text: t('x_fo3', { n: x.n, one: x.one, r: x.r }), big: true }];
      return [{ text: t('x_si1', { n: x.n, d: x.d }), vis: { type: 'bars', fracs: [[x.n, x.d, x.n + '/' + x.d]] } }, { text: t('x_si2', { n: x.n, d: x.d, g: x.g, n2: x.n2, d2: x.d2 }) }, { text: t('x_si3', { n: x.n, d: x.d, n2: x.n2, d2: x.d2 }), big: true, vis: { type: 'bars', fracs: [[x.n2, x.d2, x.n2 + '/' + x.d2]] } }];
    },
    decimals: q => [{ text: t('x_da1'), vis: { type: 'column', a: q.x.a, b: q.x.b, op: '+' } }, { text: t('x_da2') }, { text: t('x_da3', { a: q.x.a, b: q.x.b, r: q.x.r }), big: true }],
    fraction: q => { const { n, kind } = q.x;
      if (kind === 'halfOdd') { const a = (n - 1) / 2; return [{ text: t('x_halfO1'), vis: { type: 'pie', n: 1, d: 2 } }, { text: t('x_halfO2', { n, a }), vis: { type: 'dots', groups: [{ n: a, color: 'a' }, { n: a, color: 'b' }, { n: 1, color: 'x' }] } }, { text: t('x_halfO3', { n, r: n / 2 }), big: true }]; } if (kind === 'half') return [{ text: t('x_half1'), vis: { type: 'pie', n: 1, d: 2 } }, { text: t('x_half2', { n, h: n / 2 }), vis: { type: 'groups', groups: 2, each: n / 2 } }, { text: `${n} ÷ 2 = ${n / 2}`, big: true }]; return [{ text: t('x_q1'), vis: { type: 'pie', n: 1, d: 4 } }, { text: t('x_q2', { n, q: n / 4 }), vis: { type: 'groups', groups: 4, each: n / 4 } }, { text: `${n} ÷ 4 = ${n / 4}`, big: true }]; },
    round: q => { const { n } = q.x, lo = Math.floor(n / 10) * 10, hi = lo + 10, d = n % 10, r = d >= 5 ? hi : lo; return [{ text: t('x_rnd1', { n, lo, hi }), vis: { type: 'numline', from: lo, to: hi, marks: [lo, hi], point: n } }, { text: t('x_rnd2', { d }) }, { text: t('x_rnd3', { n, r }), big: true }]; },

  // "Show me the path": one real intermediate step of the method, asked when a right answer looks like a lucky click.
  // Each entry returns {prompt, answer, choices?, ok?(typed), vis?}; null means this question cannot be checked.
  const others = (arr, not, n) => shuffle(arr.filter(x => x !== not)).slice(0, n);
  const PATH = {
    count: q => { const n = q.x.n, k = n > 2 ? Math.ceil(n / 2) : 1; return { prompt: t('p_count'), answer: k, choices: choicesAround(k, 4, 1, 10), vis: { type: 'dots', groups: [{ n: k, color: 'a' }, { n: n - k, color: 'x' }] } }; },
    compare: q => ({ prompt: t('p_cmp'), answer: q.x.a, choices: choicesAround(q.x.a, 4, 1, 10), vis: { type: 'dots', groups: [{ n: q.x.a, hl: q.x.a }] } }),
    addPic: q => PATH.add20(q),
    add20: q => { const { a, b } = q.x; return a + b <= 10 ? { prompt: t('p_add_on', { a }), answer: a + 1 } : { prompt: t('p_ten', { a }), answer: 10 - a }; },
    nextNum: q => ({ prompt: t('p_pat'), answer: q.x.step, choices: shuffle([q.x.step, ...others([1, 2, 3, 5, 10], q.x.step, 3)]) }),
    sub20: q => { const { a, b } = q.x; return b > 3 && b < 10 && a > 10 ? { prompt: t('p_sub_ten', { b }), answer: 10 - b } : { prompt: t('p_sub_back', { a }), answer: a - 1 }; },
    missing: q => ({ prompt: t('p_miss', { a: q.x.a }), answer: q.x.a + 1 }),
    double: q => ({ prompt: t('p_dbl', { a: q.x.a, b: q.x.a - 1 }), answer: 2 * q.x.a - 1 }),
    tens: q => ({ prompt: t('p_tens', { a: q.x.a }), answer: q.x.a / 10 }),
    add100: q => { const a1 = q.x.a % 10, b1 = q.x.b % 10; return { prompt: t('p_ones_add', { a1, b1 }), answer: a1 + b1 }; },
    sub100: q => { const a1 = q.x.a % 10, b1 = q.x.b % 10; return a1 < b1 ? { prompt: t('p_borrow', { a1, b1, a1p: a1 + 10 }), answer: a1 + 10 - b1 } : { prompt: t('p_ones_sub', { a1, b1 }), answer: a1 - b1 }; },
    times: q => { const { a, b } = q.x, k = Math.min(3, a); return { prompt: t('p_skip', { b, seq: up(0, k - 1, b) }), answer: k * b }; },
    divide: q => ({ prompt: t('p_div_check', { q: q.x.q, b: q.x.b }), answer: q.x.n }),
    fraction: q => { const { n, kind } = q.x; if (kind === 'halfOdd') return { prompt: t('p_halfO', { m: n - 1 }), answer: (n - 1) / 2 }; if (kind === 'quarter') return { prompt: t('p_half_first', { n }), answer: n / 2 }; return { prompt: t('p_parts', { name: t('half') }), answer: 2, choices: shuffle([2, 3, 4, 5]) }; },
    round: q => ({ prompt: t('p_digit', { n: q.x.n }), answer: q.x.n % 10 }),
    mult2: q => { const { a, b } = q.x, tt = Math.floor(a / 10) * 10, o = a % 10; return { prompt: t('p_split', { a, tt, o, b }), answer: tt * b }; },
    mult22: q => { const at = Math.floor(q.x.a / 10) * 10, bt = Math.floor(q.x.b / 10) * 10; return { prompt: t('p_area', { at, bt }), answer: at * bt }; },
    longdiv: q => ({ prompt: t('p_ld', { b: q.x.b, q: q.x.q }), answer: q.x.b * q.x.q }),
    fracadd: q => { const x = q.x; if (x.kind === 'fracof') return { prompt: t('p_one', { t: x.t, d: x.d }), answer: x.one }; return { prompt: t('p_gcd', { n: x.n, d: x.d }), answer: x.g, ok: v => { const k = parseInt(v, 10); return k > 1 && x.n % k === 0 && x.d % k === 0; } }; },
    decimals: q => { const ta = Math.round((parseFloat(q.x.a) % 1) * 10), tb = Math.round((parseFloat(q.x.b) % 1) * 10); return { prompt: t('p_tenths', { ta, tb }), answer: ta + tb }; },
