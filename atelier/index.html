<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>סדנת אומן · The Atelier · Kingdom Quest</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700;800&display=swap">
<style>
/* Layout: one 16:9 stage, as wide as the screen allows. The shop is a filmed STILL while the kid works (the loop plays only between clients: Yoni 2026-10-19, 'you can't have a video when you're trying to focus on measuring'). The client, tools and fabrics are keyed filmed stills; measuring, drafting and cutting live in an SVG layer on top; words in a big bubble; a big number pad when a number is asked. Every size is a fraction of the stage height (1u = 1 % of it) and scaled for a child's hand and eye. */
:root{ --bg:#0b0a14; --ink:#fff4dc; --muted:#cbb9d8; --gold:#f2c14e; --gold-2:#ffe7a8; --panel:rgba(18,12,34,.86); --edge:rgba(242,193,78,.7); --ok:#7fd97f; --bad:#ff8a8a; --body:"Assistant", Rubik, "Arial Hebrew", system-ui, sans-serif; color-scheme:dark }
html,body{height:100%} body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--body); line-height:1.35; overflow:hidden}
#app{position:fixed; inset:0; display:grid; place-items:center; background:var(--bg)}
#stage{position:relative; width:min(100vw, calc(100vh * 16 / 9)); height:min(100vh, calc(100vw * 9 / 16)); overflow:hidden; background:#1a1430; touch-action:none; user-select:none; -webkit-user-select:none; font-size:calc(var(--u) * 2.3px)}
#stage > *{position:absolute}
#world{inset:0; transform-origin:0 0; will-change:transform} #world > *{position:absolute} #table{inset:0; width:100%; height:100%; pointer-events:none} #table *{pointer-events:auto} #table rect[fill="transparent"]{pointer-events:all}
#scene{inset:0} #scene video, #scene img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover} #scene video{opacity:0; transition:opacity .8s} #scene video.on{opacity:1} #scene{transition:filter .8s}
#actors{inset:0; pointer-events:none} .actor{position:absolute; bottom:0; transform-origin:50% 100%; filter:drop-shadow(0 .5em .4em rgba(0,0,0,.35)); transition:transform .9s cubic-bezier(.3,1,.4,1), opacity .5s}
#overlay{inset:0; width:100%; height:100%}
#ui{inset:0; pointer-events:none} #ui > *{pointer-events:auto}
.hud{position:absolute; top:.5em; inset-inline:.5em; display:flex; justify-content:space-between; align-items:flex-start; gap:.5em; pointer-events:none} .hud > *{pointer-events:auto} .chips{display:flex; gap:.4em; flex-wrap:wrap}
.chip{display:inline-flex; align-items:center; gap:.35em; background:var(--panel); border:.1em solid var(--edge); border-radius:999px; padding:.3em .8em; font-weight:800; font-size:1em; color:var(--gold-2); backdrop-filter:blur(6px)} .chip img{height:1.3em; width:1.3em; object-fit:contain}
.btn{border:0; border-radius:999px; background:linear-gradient(180deg,#ffe08a,#f2b84a); color:#3a1a44; font:800 1.15em var(--body); padding:.5em 1.3em; cursor:pointer; box-shadow:0 .22em 0 #b8862a, 0 .5em 1em rgba(0,0,0,.35)} .btn:active{transform:translateY(.12em); box-shadow:0 .1em 0 #b8862a} .btn.ghost{background:var(--panel); color:var(--gold-2); border:.1em solid var(--edge); box-shadow:none} .btn.big{font-size:1.5em; padding:.6em 1.6em}
.dock{position:absolute; left:50%; bottom:.7em; transform:translateX(-50%); max-width:min(70%, 32em); display:flex; flex-direction:row; align-items:flex-end; gap:.3em; pointer-events:none; transition:left .9s cubic-bezier(.4,0,.2,1), top .9s cubic-bezier(.4,0,.2,1)} .dock.anch{transform:none; bottom:auto} .dock > *{pointer-events:auto}
#ui > .dock{pointer-events:none} .dock .col{pointer-events:none !important;} .dock .col button, .dock .col .bubble .spk{pointer-events:auto} .dock .bubble{pointer-events:none} .dock .col{display:flex; flex-direction:column; align-items:center; gap:.45em; min-width:0}
.dock .bear{flex:0 0 auto; width:4.6em; height:6.6em; position:relative; pointer-events:none} .dock .bearimg{position:absolute; inset:0; background-repeat:no-repeat; background-size:contain; background-position:center bottom; animation:bearIdle 3s ease-in-out infinite; transform-origin:50% 100%} .dock .bear.talk .bearimg{animation:none} @keyframes bearIdle{50%{transform:translateY(-.12em) rotate(-1.5deg)}} @keyframes bearTalk{50%{transform:scale(1.04,.97) rotate(2deg)}}
.bubble .spk{float:inline-start; margin-inline-end:.4em; width:1.8em; height:1.8em; border-radius:50%; border:0; background:var(--gold); color:#3a1a44; font-size:.85em; cursor:pointer; box-shadow:0 .15em 0 #b8862a}
.bubble{position:relative; max-width:100%; background:var(--panel); border:.12em solid var(--edge); border-radius:1em; padding:.6em 1em; font-weight:700; font-size:1.25em; line-height:1.3; backdrop-filter:blur(8px); box-shadow:0 .6em 1.6em rgba(0,0,0,.45); text-align:center} .bubble .who{display:block; font-size:.75em; color:var(--muted); margin-bottom:.1em} .bubble.teach{border-color:#8fd0f0} .bubble.ok{border-color:var(--ok)} .bubble.bad{border-color:var(--bad)}
.actions{display:flex; justify-content:center; gap:.6em; flex-wrap:wrap} .actions:empty{display:none}
.pad{position:absolute; inset-inline-end:.6em; bottom:.6em; width:11.5em; background:var(--panel); border:.12em solid var(--edge); border-radius:1em; padding:.5em; backdrop-filter:blur(8px); box-shadow:0 .6em 1.6em rgba(0,0,0,.45); direction:ltr} .pad .val{height:1.8em; display:flex; align-items:center; justify-content:flex-end; gap:.3em; font:800 1.6em var(--body); color:var(--gold-2); padding:0 .4em; background:rgba(0,0,0,.35); border-radius:.4em; margin-bottom:.35em} .pad .val small{font-size:.5em; color:var(--muted)} .pad .keys{display:grid; grid-template-columns:repeat(3,1fr); gap:.3em} .pad .keys button{height:2.1em; border:0; border-radius:.5em; background:rgba(255,255,255,.14); color:var(--ink); font:800 1.35em var(--body); cursor:pointer} .pad .keys button:active{background:rgba(255,255,255,.28)} .pad .keys .go{grid-column:span 3; background:linear-gradient(180deg,#ffe08a,#f2b84a); color:#3a1a44} .pad.bad .val{outline:.15em solid var(--bad)}
.readout{position:absolute; left:50%; top:3.2em; transform:translateX(-50%); background:#f7f0dc; border:.22em solid #d8b04a; border-radius:.5em; padding:.25em .3em; box-shadow:0 .5em 1.4em rgba(0,0,0,.45); direction:ltr} .readout canvas{display:block; width:24em; height:5em; border-radius:.25em}
.note{width:14em; font-size:.92em; position:absolute; inset-inline-start:.6em; top:2.6em; max-height:calc(var(--u) * 74px); overflow:auto; background:#fbf5e4; color:#2a1a0a; border:.15em solid #d8b04a; border-radius:.6em; padding:.5em .8em; font-weight:800; font-size:1.05em; min-width:9em; box-shadow:0 .5em 1.2em rgba(0,0,0,.4)} .note h4{margin:0 0 .3em; font-size:1em; color:#8a5a1a} .note div{display:flex; justify-content:space-between; gap:.8em; padding:.1em 0; border-bottom:.08em dashed #d8b04a} .note h4.ptn{margin-top:.4em; color:#3a6a9a} .note .rule{margin:.1em 0; font-size:.78em; font-weight:700; color:#3a5a7a} .note .pt b{color:#1a5a2a} .note .empty{font-size:.85em; color:#8a6a3a} .note .blink{animation:blink .45s 6}
.fabrics{position:absolute; inset-inline-start:.6em; bottom:5.6em; display:grid; grid-template-columns:repeat(6, 2.6em); gap:.3em; background:var(--panel); padding:.5em; border-radius:.8em; border:.1em solid var(--edge)} .fabrics button{width:2.6em; height:2.6em; border-radius:.5em; border:.12em solid rgba(255,255,255,.25); background-size:cover; cursor:pointer; padding:0; overflow:hidden} .fabrics button svg{width:100%; height:100%; display:block} .fabrics button.on{border-color:var(--gold); box-shadow:0 0 0 .12em var(--gold)}
.sheet{position:absolute; inset:0; display:grid; place-items:center; background:rgba(11,10,20,.88); backdrop-filter:blur(8px)} .sheet .card{width:min(92%, 30em); background:var(--panel); border:.12em solid var(--edge); border-radius:1.2em; padding:1.2em 1.4em; text-align:center; box-shadow:0 1em 3em rgba(0,0,0,.5)} .sheet h1{margin:0 0 .1em; font-size:2.4em; color:var(--gold-2)} .sheet p{margin:0 0 .6em; color:var(--muted); font-size:1.1em} .sheet .row{display:flex; gap:.35em; flex-wrap:wrap; justify-content:center; margin:.5em 0} .sheet .row button{min-width:2.4em; height:2.4em; border-radius:.6em; border:.1em solid rgba(255,255,255,.2); background:rgba(255,255,255,.08); color:var(--ink); font:800 1.15em var(--body); cursor:pointer} .sheet .row button.on{background:var(--gold); color:#3a1a44} .sheet input{font:800 1.3em var(--body); padding:.35em .8em; border-radius:.6em; border:.1em solid var(--edge); background:rgba(0,0,0,.3); color:var(--ink); text-align:center; width:70%}
.closet{position:absolute; inset:0; background:rgba(11,10,20,.92); padding:3.4em 1.2em 1.2em; overflow:auto; backdrop-filter:blur(8px)} .closet .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(7em,1fr)); gap:.7em} .closet .item{background:var(--panel); border:.08em solid rgba(255,255,255,.12); border-radius:.8em; padding:.4em; text-align:center} .closet .item svg{width:100%; height:6em} .closet .item small{color:var(--muted); font-size:.8em} .closet p{font-size:1.2em}
.burst{position:absolute; inset:0; pointer-events:none; overflow:hidden} .burst i{position:absolute; width:.45em; height:.45em; border-radius:.12em; animation:fly 1.1s ease-out forwards} @keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(540deg); opacity:0}}
.ver{position:absolute; inset-inline-end:.5em; bottom:.2em; font-size:.55em; color:rgba(255,255,255,.4); pointer-events:none}

/* v3: the client figure with its garment layers; the table scene; the order card */
.figure{position:absolute; transition:transform .9s cubic-bezier(.3,1,.4,1), opacity .5s; filter:drop-shadow(0 calc(var(--u)*0.8px) calc(var(--u)*0.6px) rgba(0,0,0,.35))} .figure img.client, .figure canvas.garment{position:absolute; inset:0; width:100%; height:100%}
.garment{transition:transform .6s cubic-bezier(.3,1.3,.5,1), opacity .4s, clip-path .4s} .garment.ghost{opacity:.45; animation:ghost 1.6s ease-in-out infinite} @keyframes ghost{50%{opacity:.7}} .garment.pop{animation:popin .7s ease-out} @keyframes popin{0%{opacity:0; filter:brightness(1.8)} 100%{opacity:1; filter:none}}
#tableBg{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .45s; pointer-events:none} #stage.atTable #tableBg{opacity:1} #stage.atTable #world{opacity:0} #world{transition:opacity .45s, transform .75s}
#table *{transform-box:fill-box; transform-origin:center} #table .flyoff{transition:transform .45s ease-in, opacity .45s; transform:translateY(-40%) scale(.5); opacity:0}
.order{position:absolute; top:.5em; left:50%; transform:translateX(-50%); display:flex; gap:.5em; pointer-events:none} .order .item{background:var(--panel); border:.1em solid var(--edge); border-radius:.9em; padding:.2em .7em .2em .3em; display:flex; align-items:center; gap:.45em; font-weight:800; font-size:1.05em; color:var(--gold-2)} .order .ico{width:2.6em; height:2.6em; background-repeat:no-repeat; border-radius:.5em; background-color:rgba(255,255,255,.08)} .order .done{border-color:var(--ok); color:#c8f7c8}
.picker .row.cols button{width:2.6em; height:2.6em; border-radius:50%} .picker .sw{width:100%; height:100%; background-size:1.6em 1.6em} .picker .preview .sw{background-size:2.6em 2.6em}
.readout.side{left:1em; top:50%; transform:translateY(-50%)} .readout.side canvas{width:21em !important; height:5em !important}
.stages{position:absolute; top:4.2em; left:50%; transform:translateX(-50%); display:flex; gap:.3em; flex-wrap:wrap; justify-content:center; max-width:90%; pointer-events:none} .stg{background:var(--panel); border:.08em solid rgba(255,255,255,.15); border-radius:999px; padding:.15em .6em; font-weight:800; font-size:.82em; color:var(--muted)} .stg.now{border-color:var(--gold); color:var(--gold-2)} .stg.done{border-color:var(--ok); color:#c8f7c8}
#stage.atTable #tableBg{opacity:0}
.closet .item canvas{width:100%; height:9em; object-fit:contain}

@keyframes blink{50%{opacity:.2; background:#ffe08a}}
.picker{position:absolute; inset:0; display:grid; place-items:center; background:rgba(11,10,20,.72); backdrop-filter:blur(4px)} .picker .card{background:var(--panel); border:.12em solid var(--edge); border-radius:1.1em; padding:.8em 1.1em; text-align:center; box-shadow:0 1em 3em rgba(0,0,0,.5); display:grid; gap:.35em; justify-items:center} .picker h3{margin:0; font-size:1.4em; color:var(--gold-2)} .picker p{margin:.2em 0 0; color:var(--muted); font-weight:800} .picker .row{display:flex; gap:.35em; flex-wrap:wrap; justify-content:center} .picker .row button{width:3em; height:3em; border-radius:.6em; border:.14em solid rgba(255,255,255,.25); background-size:cover; padding:0; overflow:hidden; cursor:pointer} .picker .row button svg{display:block} .picker .row button.on{border-color:var(--gold); box-shadow:0 0 0 .14em var(--gold)} .picker .preview{width:7em; height:7em; border-radius:.8em; overflow:hidden; border:.14em solid var(--gold-2); margin:.3em 0}
.closetTop{margin-bottom:.8em}
@media (prefers-reduced-motion:reduce){ .burst i{animation:none} .actor{transition:none} }
</style>
</head>
<body>
<div id="app"><div id="stage">
  <div id="world">
    <div id="scene"><img id="poster" alt=""><video id="loop" muted playsinline loop preload="auto"></video></div>
    <div id="actors"></div>
    <svg id="overlay" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <img id="tableBg" alt="">
  <svg id="table" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="ui"></div>
  <div class="burst" id="burst"></div>
  <span class="ver" id="ver"></span>
</div></div>
<script src="strings.js?v=9"></script>
<script src="game.js?v=30"></script>
</body>
</html>
