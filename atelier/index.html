<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Atelier · Kingdom Quest</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700;800&display=swap">
<style>
/* Layout: one 16:9 stage, as wide as the screen allows. The shop is a filmed loop; the client, tools and fabrics are keyed filmed stills; the measuring, drafting and cutting live in an SVG layer on top; words in a bubble; a number pad when a number is asked. Phone (landscape) and desktop share the stage; the bubble and pad scale with the stage. Start screen: name, age, language. */
:root{ --bg:#0b0a14; --ink:#fff4dc; --muted:#cbb9d8; --gold:#f2c14e; --gold-2:#ffe7a8; --panel:rgba(18,12,34,.84); --edge:rgba(242,193,78,.65); --ok:#7fd97f; --bad:#ff8a8a; --body:"Assistant", Rubik, "Arial Hebrew", system-ui, sans-serif; color-scheme:dark }
html,body{height:100%} body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.4; overflow:hidden}
#app{position:fixed; inset:0; display:grid; place-items:center; background:var(--bg)}
#stage{position:relative; width:min(100vw, calc(100vh * 16 / 9)); height:min(100vh, calc(100vw * 9 / 16)); overflow:hidden; background:#1a1430; touch-action:none; user-select:none; -webkit-user-select:none; font-size:calc(var(--u) * 1px)}
#stage > *{position:absolute}
#scene{inset:0} #scene video, #scene img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover} #scene video{opacity:0; transition:opacity .6s} #scene video.on{opacity:1}
#actors{inset:0; pointer-events:none} .actor{position:absolute; bottom:0; transform-origin:50% 100%; filter:drop-shadow(0 .6em .5em rgba(0,0,0,.35)); transition:transform .9s cubic-bezier(.3,1,.4,1), opacity .5s}
#overlay{inset:0; width:100%; height:100%} #overlay *{vector-effect:non-scaling-stroke}
#ui{inset:0; pointer-events:none} #ui > *{pointer-events:auto}
.hud{position:absolute; top:.8em; inset-inline:.8em; display:flex; justify-content:space-between; align-items:flex-start; gap:.6em; pointer-events:none} .hud > *{pointer-events:auto} .chip{display:inline-flex; align-items:center; gap:.4em; background:var(--panel); border:1px solid var(--edge); border-radius:999px; padding:.35em .8em; font-weight:800; font-size:1em; backdrop-filter:blur(6px); color:var(--gold-2)} .chip img{height:1.2em; width:1.2em; object-fit:contain}
.chips{display:flex; gap:.5em; flex-wrap:wrap}
.btn{border:0; border-radius:999px; background:linear-gradient(180deg,#ffe08a,#f2b84a); color:#3a1a44; font:800 1.1em var(--body); padding:.55em 1.3em; cursor:pointer; box-shadow:0 .25em 0 #b8862a, 0 .6em 1.2em rgba(0,0,0,.35)} .btn:active{transform:translateY(.15em); box-shadow:0 .1em 0 #b8862a} .btn.ghost{background:var(--panel); color:var(--gold-2); border:1px solid var(--edge); box-shadow:none} .btn[disabled]{opacity:.45; pointer-events:none}
.bubble{position:absolute; left:50%; bottom:1em; transform:translateX(-50%); max-width:min(70%, 46em); background:var(--panel); border:1px solid var(--edge); border-radius:1.2em; padding:.7em 1.1em; font-weight:700; font-size:1.15em; line-height:1.35; backdrop-filter:blur(8px); box-shadow:0 .8em 2em rgba(0,0,0,.4); text-align:center} .bubble .who{display:block; font-size:.8em; color:var(--muted); margin-bottom:.15em} .bubble.ok{border-color:var(--ok)} .bubble.bad{border-color:var(--bad)}
.actions{position:absolute; inset-inline:0; bottom:5.2em; display:flex; justify-content:center; gap:.6em; pointer-events:none} .actions > *{pointer-events:auto}
.pad{position:absolute; inset-inline-end:1em; bottom:1em; width:13em; background:var(--panel); border:1px solid var(--edge); border-radius:1.2em; padding:.6em; backdrop-filter:blur(8px); box-shadow:0 .8em 2em rgba(0,0,0,.4); direction:ltr} .pad .val{height:2em; display:flex; align-items:center; justify-content:flex-end; gap:.3em; font:800 1.5em var(--body); color:var(--gold-2); padding:0 .4em; background:rgba(0,0,0,.3); border-radius:.5em; margin-bottom:.4em} .pad .val small{font-size:.5em; color:var(--muted)} .pad .keys{display:grid; grid-template-columns:repeat(3,1fr); gap:.35em} .pad .keys button{height:2.4em; border:0; border-radius:.6em; background:rgba(255,255,255,.12); color:var(--ink); font:800 1.2em var(--body); cursor:pointer} .pad .keys button:active{background:rgba(255,255,255,.25)} .pad .keys .go{grid-column:span 3; background:linear-gradient(180deg,#ffe08a,#f2b84a); color:#3a1a44} .pad.bad .val{outline:2px solid var(--bad)}
.tray{position:absolute; inset-inline-start:1em; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:.5em} .tool{width:4.2em; height:4.2em; border-radius:1em; background:var(--panel); border:1px solid rgba(255,255,255,.15); display:grid; place-items:center; cursor:pointer} .tool img{width:85%; height:85%; object-fit:contain; pointer-events:none} .tool.on{border-color:var(--gold); box-shadow:0 0 0 2px var(--gold)} .tool .n{position:absolute; bottom:-1.2em; font-size:.65em; color:var(--muted); white-space:nowrap}
.readout{position:absolute; left:50%; top:2.6em; transform:translateX(-50%); background:#f7f0dc; border:.25em solid #d8b04a; border-radius:.6em; padding:.3em .4em; box-shadow:0 .6em 1.5em rgba(0,0,0,.45); direction:ltr} .readout canvas{display:block; width:22em; height:4.2em; border-radius:.3em}
.fabrics{position:absolute; inset-inline-start:1em; bottom:5.5em; display:flex; gap:.5em} .fabrics button{width:3.4em; height:3.4em; border-radius:.8em; border:2px solid rgba(255,255,255,.2); background-size:cover; cursor:pointer} .fabrics button.on{border-color:var(--gold); box-shadow:0 0 0 2px var(--gold)}
.sheet{position:absolute; inset:0; display:grid; place-items:center; background:rgba(11,10,20,.86); backdrop-filter:blur(8px)} .sheet .card{width:min(92%, 40em); background:var(--panel); border:1px solid var(--edge); border-radius:1.4em; padding:1.4em 1.6em; text-align:center; box-shadow:0 1em 3em rgba(0,0,0,.5)} .sheet h1{margin:0 0 .2em; font-size:2em; color:var(--gold-2)} .sheet p{margin:0 0 .8em; color:var(--muted)} .sheet .row{display:flex; gap:.4em; flex-wrap:wrap; justify-content:center; margin:.6em 0} .sheet .row button{min-width:2.6em; height:2.6em; border-radius:.7em; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.08); color:var(--ink); font:800 1.05em var(--body); cursor:pointer} .sheet .row button.on{background:var(--gold); color:#3a1a44} .sheet input{font:800 1.2em var(--body); padding:.4em .8em; border-radius:.7em; border:1px solid var(--edge); background:rgba(0,0,0,.3); color:var(--ink); text-align:center; width:60%}
.closet{position:absolute; inset:0; background:rgba(11,10,20,.9); padding:3.6em 1.5em 1.5em; overflow:auto; backdrop-filter:blur(8px)} .closet .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(9em,1fr)); gap:.8em} .closet .item{background:var(--panel); border:1px solid rgba(255,255,255,.12); border-radius:1em; padding:.5em; text-align:center} .closet .item svg{width:100%; height:7em} .closet .item small{color:var(--muted); font-size:.75em}
.burst{position:absolute; inset:0; pointer-events:none; overflow:hidden} .burst i{position:absolute; width:.5em; height:.5em; border-radius:.15em; animation:fly 1.1s ease-out forwards} @keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(540deg); opacity:0}}
.hidden{display:none !important}
.ver{position:absolute; inset-inline-end:.6em; bottom:.25em; font-size:.6em; color:rgba(255,255,255,.35); pointer-events:none}
@media (prefers-reduced-motion:reduce){ .burst i{animation:none} .actor{transition:none} }
</style>
</head>
<body>
<div id="app"><div id="stage">
  <div id="scene"><img id="poster" alt=""><video id="loop" muted playsinline loop preload="auto"></video></div>
  <div id="actors"></div>
  <svg id="overlay" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="ui"></div>
  <div class="burst" id="burst"></div>
  <span class="ver" id="ver"></span>
</div></div>
<script src="strings.js?v=1"></script>
<script src="game.js?v=1"></script>
</body>
</html>
