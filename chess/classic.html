<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Castle Chess</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
:root{
  --bg:#ecdfc3; --bg-deep:#d9c69b;
  --paper:#f8efdc; --paper-2:#efe2c4; --paper-line:#cdb68a;
  --ink:#2b1c10; --ink-2:#5a4531; --muted:#86745b;
  --stone:#8d857b; --stone-2:#6e665d; --stone-3:#b5ac9f; --mortar:#4f4a44;
  --sq-light:#f0dcb3; --sq-dark:#a9713f;
  --gold:#c9a227; --gold-2:#8f6f12; --crimson:#8e1f2f; --crimson-2:#6b1522; --forest:#2f6b3a;
  --sel:rgba(255,212,0,.55); --last:rgba(255,196,60,.45); --check:rgba(222,45,45,.75); --legal:rgba(25,70,35,.38);
  --btn:#5a3a1f; --btn-ink:#f8efdc;
  --shadow:0 10px 30px rgba(60,40,10,.22);
  --pf-w:#f7edd9; --ps-w:#4a3222; --pf-b:#3a2e28; --ps-b:#efe1c4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#191512; --bg-deep:#100d0b; --paper:#2a221a; --paper-2:#342a1f; --paper-line:#5a4a33;
    --ink:#f1e5cb; --ink-2:#d9c8a6; --muted:#a8967a;
    --stone:#4b453f; --stone-2:#332f2b; --stone-3:#655c53; --mortar:#1f1b18;
    --sq-light:#d8c096; --sq-dark:#8a5a30;
    --btn:#c9a227; --btn-ink:#2b1c10; --shadow:0 10px 30px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#191512; --bg-deep:#100d0b; --paper:#2a221a; --paper-2:#342a1f; --paper-line:#5a4a33;
  --ink:#f1e5cb; --ink-2:#d9c8a6; --muted:#a8967a;
  --stone:#4b453f; --stone-2:#332f2b; --stone-3:#655c53; --mortar:#1f1b18;
  --sq-light:#d8c096; --sq-dark:#8a5a30;
  --btn:#c9a227; --btn-ink:#2b1c10; --shadow:0 10px 30px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0; background:var(--bg) radial-gradient(ellipse at 50% -10%, var(--paper) 0, transparent 55%);
  color:var(--ink); font:500 16px/1.4 Nunito, "Segoe UI", system-ui, sans-serif;
  padding-block:0 40px; padding-inline:16px; min-height:100%;
}
:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
h1,h2,h3{text-wrap:balance; margin:0}
.svgdefs{position:absolute; width:0; height:0; overflow:hidden}
symbol .f{fill:var(--pf); stroke:var(--ps); stroke-width:3.4; stroke-linejoin:round; stroke-linecap:round}
symbol .d{fill:var(--ps); stroke:none}
symbol .s{fill:none; stroke:var(--ps); stroke-width:3; stroke-linecap:round}

/* ---------- banner ---------- */
.banner{display:flex; flex-direction:column; align-items:center; gap:2px; padding-block:18px 8px; text-align:center}
.banner .crown{width:54px; height:auto; color:var(--gold); filter:drop-shadow(0 2px 0 var(--gold-2))}
.banner h1{font:800 clamp(30px,6vw,48px)/1.1 Cinzel, Georgia, serif; letter-spacing:.08em; color:var(--crimson); text-shadow:0 2px 0 var(--gold)}
.banner .tag{font-weight:700; font-size:13px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted)}

/* ---------- layout ---------- */
.layout{display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:30px; max-width:1120px; margin:0 auto; align-items:start}
@media (max-width:920px){ .layout{grid-template-columns:1fr; gap:18px} }
.stage{display:flex; flex-direction:column; align-items:center; gap:16px; min-width:0}

/* ---------- castle frame + board ---------- */
.castle{
  position:relative; width:min(100%, 660px); margin-top:52px; padding:4.4%;
  background:linear-gradient(160deg, var(--stone-3), var(--stone) 45%, var(--stone-2));
  border-radius:8px; box-shadow:var(--shadow), inset 0 0 0 3px var(--mortar), inset 0 0 0 6px var(--stone-3);
}
.castle::before{
  content:""; position:absolute; left:9%; right:9%; top:-16px; height:18px; border-radius:3px 3px 0 0;
  background:repeating-linear-gradient(90deg, var(--stone) 0 22px, transparent 22px 36px);
  filter:drop-shadow(0 -1px 0 var(--stone-3));
}
.tower{position:absolute; width:12%; max-width:64px; pointer-events:none}
.tower svg{width:100%; height:auto; display:block; filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
.tower.tl{top:-8%; left:-3%} .tower.tr{top:-8%; right:-3%}
.tower.bl{bottom:-2%; left:-3%} .tower.br{bottom:-2%; right:-3%}
.board{
  position:relative; width:100%; aspect-ratio:1; display:grid; grid-template-columns:repeat(8,1fr); grid-template-rows:repeat(8,1fr);
  border:3px solid var(--mortar); box-shadow:inset 0 0 14px rgba(0,0,0,.35); user-select:none; -webkit-user-select:none; touch-action:none;
}
.sq{position:relative; font:800 clamp(8px,1.5vw,12px)/1 Nunito, sans-serif}
.sq.light{background:var(--sq-light)} .sq.dark{background:var(--sq-dark)}
.sq.light::before,.sq.light::after{color:var(--sq-dark)} .sq.dark::before,.sq.dark::after{color:var(--sq-light)}
.sq[data-rank]::before{content:attr(data-rank); position:absolute; top:3px; left:4px}
.sq[data-file]::after{content:attr(data-file); position:absolute; bottom:2px; right:4px}
.sq.last{box-shadow:inset 0 0 0 100vmax var(--last)}
.sq.sel{box-shadow:inset 0 0 0 100vmax var(--sel)}
.sq.legal{background-image:radial-gradient(circle, var(--legal) 0 17%, transparent 18%)}
.sq.legal.cap{background-image:radial-gradient(circle, transparent 0 60%, var(--legal) 61% 76%, transparent 77%)}
.sq.check{background-image:radial-gradient(circle, var(--check) 0 38%, transparent 72%)}
.sq.book{box-shadow:inset 0 0 0 4px var(--gold); animation:glow 1.1s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:inset 0 0 0 3px var(--gold)} to{box-shadow:inset 0 0 0 6px var(--gold), inset 0 0 0 100vmax rgba(201,162,39,.25)}}
.pieces{position:absolute; inset:0; pointer-events:none}
.pc{position:absolute; left:0; top:0; width:12.5%; height:12.5%; pointer-events:auto; cursor:grab; transition:transform .22s ease, opacity .25s; touch-action:none}
.pc svg{width:100%; height:100%; display:block; filter:drop-shadow(0 2px 1.5px rgba(0,0,0,.38)); transition:transform .15s}
.pc.w{--pf:var(--pf-w); --ps:var(--ps-w)} .pc.b{--pf:var(--pf-b); --ps:var(--ps-b)}
.pc.dragging{transition:none; z-index:6; cursor:grabbing} .pc.dragging svg{transform:scale(1.18)}
.pc.gone{opacity:0; pointer-events:none} .pc.gone svg{transform:scale(.3) rotate(25deg)}
.pc.pop{animation:pop .28s ease}
@keyframes pop{from{opacity:0} 50%{opacity:1} }
.pc.pop svg{animation:popsvg .28s ease}
@keyframes popsvg{from{transform:scale(.2)} 70%{transform:scale(1.15)} to{transform:scale(1)}}
.arrows{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible}
.arrows line{stroke-width:.2; stroke-linecap:round; opacity:.9}
.arrows .book{stroke:var(--gold)} .arrows .hint{stroke:var(--forest)}

/* ---------- herald ---------- */
.herald{
  display:flex; gap:12px; align-items:center; width:min(100%, 660px); min-height:64px;
  background:var(--paper); border:1.5px solid var(--paper-line); border-radius:14px; padding:12px 16px;
  font-weight:700; font-size:17px; line-height:1.3; box-shadow:var(--shadow); position:relative;
}
.herald::before{content:""; position:absolute; left:28px; top:-9px; width:16px; height:16px; background:var(--paper); border-left:1.5px solid var(--paper-line); border-top:1.5px solid var(--paper-line); transform:rotate(45deg)}
.herald .icon{font-size:28px; line-height:1; flex:none}
.herald .who{font:800 11px/1 Cinzel, serif; letter-spacing:.14em; text-transform:uppercase; color:var(--crimson); display:block; margin-bottom:3px}
.herald.bump{animation:bump .35s ease}
@keyframes bump{0%{transform:scale(.97)} 60%{transform:scale(1.02)} 100%{transform:scale(1)}}
.music-hint{font-size:13px; font-weight:700; color:var(--muted); background:var(--paper-2); border-radius:999px; padding:6px 14px}

/* ---------- panel ---------- */
.panel{display:grid; gap:14px; min-width:0}
.card{background:var(--paper); border:1.5px solid var(--paper-line); border-radius:12px; padding:14px 16px}
.card h2{font:800 13px/1 Cinzel, serif; letter-spacing:.14em; text-transform:uppercase; color:var(--crimson); margin-bottom:10px}
.turn{display:flex; align-items:center; gap:10px; font-weight:800; font-size:17px; min-height:30px}
.turn .dot{width:20px; height:20px; border-radius:50%; border:2px solid var(--ps-w); background:var(--pf-w); flex:none; box-shadow:0 1px 2px rgba(0,0,0,.3)}
.turn .dot.b{background:var(--pf-b); border-color:var(--ps-b)}
.turn .badge{margin-left:auto; font:800 12px/1 Nunito; letter-spacing:.08em; padding:6px 9px; border-radius:999px; background:var(--crimson); color:#fff}
.turn .badge.think{background:var(--gold); color:var(--ink)}
.cap{display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:8px; margin-top:8px; font-size:13px; font-weight:800; color:var(--muted)}
.cap .row{display:flex; flex-wrap:wrap; gap:0; min-height:24px}
.cap .row svg{width:24px; height:24px; margin-right:-6px; filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.cap .row.w{--pf:var(--pf-w); --ps:var(--ps-w)} .cap .row.b{--pf:var(--pf-b); --ps:var(--ps-b)}
.cap .plus{font-variant-numeric:tabular-nums; color:var(--forest)}
.btns{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.btn{font:800 14px/1 Nunito, sans-serif; padding:11px 8px; border-radius:10px; background:var(--btn); color:var(--btn-ink); border:0; box-shadow:0 3px 0 rgba(0,0,0,.28); cursor:pointer; white-space:nowrap}
.btn:active{transform:translateY(2px); box-shadow:none}
.btn:disabled{opacity:.45; cursor:default; transform:none; box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn.gold{background:var(--gold); color:#2b1c10}
.btn.crimson{background:var(--crimson); color:#fff}
.btn.wide{grid-column:1/-1}
.fields{display:grid; gap:10px}
.field{display:grid; gap:4px}
.field label{font-weight:800; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
select,input[type=range]{width:100%; font:700 15px Nunito, sans-serif; color:var(--ink)}
select{padding:9px 10px; border-radius:9px; border:1.5px solid var(--paper-line); background:var(--paper-2)}
.check{display:flex; align-items:center; gap:10px; font-weight:700; font-size:15px; cursor:pointer}
.check input{width:20px; height:20px; accent-color:var(--crimson)}
.two{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.trainer{margin-top:10px; padding:10px 12px; background:var(--paper-2); border-radius:9px; font-size:14px; font-weight:700; display:flex; align-items:center; gap:10px}
.trainer .bar{flex:1; height:8px; border-radius:4px; background:var(--paper-line); overflow:hidden}
.trainer .bar i{display:block; height:100%; background:var(--gold); width:0; transition:width .3s}
.trainer button{font:800 12px Nunito; padding:6px 9px; border-radius:8px; border:1.5px solid var(--paper-line); background:var(--paper); color:var(--ink); cursor:pointer}
.moves{max-height:220px; overflow:auto; font-variant-numeric:tabular-nums; display:grid; grid-template-columns:auto 1fr 1fr; gap:2px 10px; font-weight:700; font-size:15px; margin:0; padding:0; list-style:none}
.moves .n{color:var(--muted)} .moves .san{padding:2px 6px; border-radius:6px} .moves .san.cur{background:var(--sel)}
.moves .empty{grid-column:1/-1; color:var(--muted); font-weight:600}

/* ---------- overlays ---------- */
.overlay{position:fixed; inset:0; background:rgba(20,12,6,.55); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px}
.scroll{background:var(--paper); border:3px double var(--gold); border-radius:16px; padding:26px 28px; text-align:center; max-width:440px; width:100%; box-shadow:var(--shadow)}
.scroll h2{font:800 30px/1.1 Cinzel, serif; color:var(--crimson); margin-bottom:8px}
.scroll p{margin:0 0 18px; font-weight:700; font-size:17px}
.scroll .btns{grid-template-columns:1fr 1fr}
.promo{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:6px}
.promo button{background:var(--paper-2); border:2px solid var(--paper-line); border-radius:12px; padding:8px; cursor:pointer}
.promo button:hover{border-color:var(--gold)}
.promo svg{width:100%; height:auto; aspect-ratio:1}
.promo.w button{--pf:var(--pf-w); --ps:var(--ps-w)} .promo.b button{--pf:var(--pf-b); --ps:var(--ps-b)}
@media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important} }
</style>

<header class="banner">
  <svg class="crown" viewBox="0 0 64 40" aria-hidden="true"><path d="M4 34h56l-4-22-12 10-12-16-12 16L8 12z" fill="currentColor"/><circle cx="8" cy="10" r="3" fill="currentColor"/><circle cx="32" cy="5" r="3" fill="currentColor"/><circle cx="56" cy="10" r="3" fill="currentColor"/><rect x="4" y="34" width="56" height="4" fill="currentColor"/></svg>
  <h1>Castle Chess</h1>
  <div class="tag">Knights, towers and clever kids</div>
</header>

<main class="layout">
  <section class="stage">
    <div class="castle">
      <div class="tower tl"><svg viewBox="0 0 40 64"><use href="#tower"/></svg></div>
      <div class="tower tr"><svg viewBox="0 0 40 64"><use href="#tower"/></svg></div>
      <div class="tower bl"><svg viewBox="0 0 40 64"><use href="#tower"/></svg></div>
      <div class="tower br"><svg viewBox="0 0 40 64"><use href="#tower"/></svg></div>
      <div class="board" id="board" aria-label="Chess board"></div>
    </div>
    <div class="herald bump" id="herald">
      <span class="icon" aria-hidden="true">📯</span>
      <div><span class="who">The Herald</span><span id="heraldText">Let the battle begin!</span></div>
    </div>
    <div class="music-hint" id="musicHint">Tap anywhere to wake the castle musicians</div>
  </section>

  <aside class="panel">
    <section class="card">
      <div class="turn" id="turn"></div>
      <div class="cap"><span>White took</span><div class="row b" id="capByW"></div><span class="plus" id="plusW"></span></div>
      <div class="cap"><span>Black took</span><div class="row w" id="capByB"></div><span class="plus" id="plusB"></span></div>
    </section>

    <section class="card">
      <div class="btns">
        <button class="btn crimson" id="btnNew">New</button>
        <button class="btn" id="btnUndo">Undo</button>
        <button class="btn" id="btnFlip">Flip</button>
        <button class="btn gold" id="btnHint">Hint</button>
      </div>
    </section>

    <section class="card">
      <h2>Battle setup</h2>
      <div class="fields">
        <div class="two">
          <div class="field"><label for="mode">Opponent</label>
            <select id="mode"><option value="cpu">Computer</option><option value="2p">Two players</option></select></div>
          <div class="field"><label for="level">Computer level</label>
            <select id="level"><option value="1">Page (easy)</option><option value="2">Squire</option><option value="3">Knight</option><option value="4">King (hard)</option></select></div>
        </div>
        <div class="field"><label for="color">I play</label>
          <select id="color"><option value="w">White</option><option value="b">Black</option><option value="random">Coin toss</option></select></div>
        <div class="field"><label for="opening">Opening trainer</label>
          <select id="opening"><option value="">Free play (no trainer)</option></select></div>
        <div class="trainer" id="trainer" hidden><span id="trainerText"></span><div class="bar"><i id="trainerBar"></i></div><button id="btnFree" type="button">Free play</button></div>
      </div>
    </section>

    <section class="card">
      <h2>Music &amp; sounds</h2>
      <div class="fields">
        <div class="field"><label for="music">Background music</label>
          <select id="music">
            <option value="bach">Bach, Prelude in C</option>
            <option value="canon">Pachelbel, Canon in D</option>
            <option value="greensleeves">Greensleeves (lute)</option>
            <option value="off">Silence</option>
          </select></div>
        <div class="field"><label for="volume">Music volume</label><input type="range" id="volume" min="0" max="1" step="0.05"></div>
        <label class="check"><input type="checkbox" id="voice"> The Herald speaks out loud</label>
        <label class="check"><input type="checkbox" id="sfx"> Battle sound effects</label>
      </div>
    </section>

    <section class="card">
      <h2>Chronicle</h2>
      <ol class="moves" id="moves"></ol>
    </section>
  </aside>
</main>

<div class="overlay" id="overlay" hidden>
  <div class="scroll" role="dialog" aria-modal="true">
    <h2 id="ovTitle">Checkmate!</h2>
    <p id="ovText"></p>
    <div class="btns"><button class="btn crimson" id="btnAgain">Play again</button><button class="btn" id="btnSwap">Switch sides</button></div>
  </div>
</div>
<div class="overlay" id="promoOverlay" hidden>
  <div class="scroll" role="dialog" aria-modal="true">
    <h2>Promotion!</h2>
    <p>Your pawn reached the far side. Pick its new form:</p>
    <div class="promo" id="promo"></div>
  </div>
</div>

<script>
(function () {
  'use strict';
  const E = CastleEngine;
